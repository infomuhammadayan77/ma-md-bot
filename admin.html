<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA BOT - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        body{background:#0a0a0a;color:#fff;min-height:100vh;}
        .login-screen{display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0a0a;}
        .login-box{background:#111;border:1px solid #333;border-radius:15px;padding:40px;width:90%;max-width:400px;text-align:center;}
        .login-box img{width:80px;height:80px;border-radius:50%;margin-bottom:20px;}
        .login-box h2{color:#00ff88;margin-bottom:10px;}
        .login-box p{color:#888;margin-bottom:30px;font-size:0.9rem;}
        .login-box input{width:100%;padding:12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:1rem;margin-bottom:15px;outline:none;}
        .login-box button{width:100%;padding:12px;background:#00ff88;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:1rem;}
        #adminPanel{display:none;}
        .sidebar{position:fixed;left:0;top:0;width:250px;height:100%;background:#111;border-right:1px solid #333;padding:20px;}
        .sidebar .logo{display:flex;align-items:center;gap:10px;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid #333;}
        .sidebar .logo img{width:40px;height:40px;border-radius:50%;}
        .sidebar .logo .name{font-size:1.3rem;font-weight:bold;color:#00ff88;}
        .sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 15px;color:#aaa;text-decoration:none;border-radius:8px;margin-bottom:5px;cursor:pointer;transition:all 0.3s;}
        .sidebar nav a:hover,.sidebar nav a.active{background:rgba(0,255,136,0.1);color:#00ff88;}
        .main-content{margin-left:250px;padding:20px;}
        .top-bar{display:flex;justify-content:space-between;align-items:center;background:#111;padding:15px 25px;border-radius:10px;margin-bottom:20px;border:1px solid #333;}
        .top-bar h2{font-size:1.2rem;color:#00ff88;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px;}
        .stat-card{background:#111;border:1px solid #333;border-radius:12px;padding:20px;text-align:center;}
        .stat-card i{font-size:2rem;color:#00ff88;margin-bottom:10px;}
        .stat-card .value{font-size:2rem;font-weight:bold;color:#fff;}
        .stat-card .label{font-size:0.85rem;color:#888;margin-top:5px;}
        .users-section{background:#111;border:1px solid #333;border-radius:12px;padding:20px;}
        .users-section h3{color:#00ff88;margin-bottom:15px;font-size:1.1rem;}
        .users-table{width:100%;border-collapse:collapse;}
        .users-table th{background:#1a1a1a;padding:12px;text-align:left;color:#888;font-size:0.85rem;border-bottom:2px solid #333;}
        .users-table td{padding:12px;border-bottom:1px solid #222;font-size:0.9rem;}
        .users-table tr:hover{background:rgba(0,255,136,0.05);}
        .status-badge{padding:4px 10px;border-radius:20px;font-size:0.75rem;font-weight:bold;}
        .status-badge.online{background:rgba(0,255,136,0.2);color:#00ff88;}
        .status-badge.offline{background:rgba(255,100,100,0.2);color:#ff6464;}
        .btn-refresh{background:#00ff88;color:#000;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;display:inline-flex;align-items:center;gap:8px;}
        .btn-refresh:hover{opacity:0.9;}
        .section{display:none;}
        .section.active{display:block;}
        @media(max-width:768px){.sidebar{width:70px;padding:10px;}.sidebar .logo .name,.sidebar .logo .sub,.sidebar nav a span{display:none;}.main-content{margin-left:70px;}.sidebar nav a{justify-content:center;padding:12px;}}
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <img src="https://i.postimg.cc/050FQZ89/Chat-GPT-Image-Aug-26-2026-03-07-12-PM.png" alt="MA BOT">
            <h2>MA BOT Admin</h2>
            <p>Enter admin password</p>
            <input type="password" id="adminPassword" placeholder="Admin Password">
            <button onclick="login()">Login</button>
        </div>
    </div>

    <div id="adminPanel">
        <div class="sidebar">
            <div class="logo">
                <img src="https://i.postimg.cc/050FQZ89/Chat-GPT-Image-Aug-26-2026-03-07-12-PM.png" alt="MA BOT">
                <div>
                    <div class="name">MA BOT</div>
                    <div class="sub">Admin Panel</div>
                </div>
            </div>
            <nav>
                <a onclick="showSection('dashboard')" class="active"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
                <a onclick="showSection('users')"><i class="fas fa-users"></i> <span>Users</span></a>
                <a onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
            </nav>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <h2>MA BOT Admin Dashboard</h2>
                <div class="user-info"><span>Muhammad Ayan</span></div>
            </div>

            <div id="dashboard" class="section active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fas fa-plug"></i>
                        <div class="value" id="totalSessions">0</div>
                        <div class="label">Total Sessions</div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-signal"></i>
                        <div class="value" id="activeSessions">0</div>
                        <div class="label">Active Users</div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-users"></i>
                        <div class="value" id="totalUsers">0</div>
                        <div class="label">Total Users</div>
                    </div>
                </div>
                <div style="text-align:center;margin-top:20px;">
                    <button class="btn-refresh" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
                </div>
            </div>

            <div id="users" class="section">
                <div class="users-section">
                    <h3><i class="fas fa-users"></i> Connected Users</h3>
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Session</th>
                                <th>Number</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="4" style="text-align:center;color:#888;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let adminPassword = localStorage.getItem('ma_admin_pass') || '';

        if (adminPassword) socket.emit('admin-auth', adminPassword);

        socket.on('admin-auth-success', () => {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            refreshData();
        });

        socket.on('admin-auth-fail', () => {
            alert('Invalid password!');
        });

        function login() {
            const pass = document.getElementById('adminPassword').value;
            localStorage.setItem('ma_admin_pass', pass);
            socket.emit('admin-auth', pass);
        }

        function logout() {
            localStorage.removeItem('ma_admin_pass');
            location.reload();
        }

        function showSection(section) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(section).classList.add('active');
            document.querySelectorAll('.sidebar nav a').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        function refreshData() {
            socket.emit('get-stats');
            socket.emit('get-users');
        }

        socket.on('stats-data', (data) => {
            document.getElementById('totalSessions').textContent = data.totalSessions || 0;
            document.getElementById('activeSessions').textContent = data.activeSessions || 0;
            document.getElementById('totalUsers').textContent = data.totalUsers || 0;
        });

        socket.on('users-data', (users) => {
            const tbody = document.getElementById('usersTableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#888;">No users connected yet</td></tr>';
                return;
            }
            tbody.innerHTML = users.map((user, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${user.sessionId}</td>
                    <td>${user.number || 'Not linked'}</td>
                    <td><span class="status-badge ${user.status}">${user.status === 'online' ? 'Online' : user.status === 'connecting' ? 'Connecting' : 'Offline'}</span></td>
                </tr>
            `).join('');
        });

        setInterval(() => {
            if (document.getElementById('adminPanel').style.display === 'block') {
                refreshData();
            }
        }, 30000);
    </script>
</body>
</html>
